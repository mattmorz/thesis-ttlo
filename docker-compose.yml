services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: ttlo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttlo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_secure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ttlo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ttlo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Drizzle ORM Database Migration Service
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ttlo_migration
    command: node dist/migrate.js
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_secure}@db:5432/${POSTGRES_DB:-ttlo_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ttlo_network
    restart: "no"

  # TTLO Portal Next.js Web Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ttlo_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_secure}@db:5432/${POSTGRES_DB:-ttlo_db}
      AUTH_SECRET: ${AUTH_SECRET:-thesis-ttlo-secure-session-auth-secret-key-2026}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET:-thesis-ttlo-secure-session-auth-secret-key-2026}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://ttlo.carsu.edu.ph}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-422203659117-g48287uc1mue5lf6hc26kg0lbpfcthkp.apps.googleusercontent.com}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-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}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-dlsu.edu.ph,carsu.edu.ph,gmail.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-eomorales@carsu.edu.ph}
      TTLO_STAFF_EMAILS: ${TTLO_STAFF_EMAILS}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - ttlo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nginx Reverse Proxy Service
  nginx:
    image: nginx:1.25-alpine
    container_name: ttlo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    networks:
      - ttlo_network

networks:
  ttlo_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local
  nginx_logs:
    driver: local
